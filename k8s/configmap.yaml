apiVersion: v1
kind: ConfigMap
metadata:
  name: notesy-config
  namespace: notesy
data:
  DJANGO_DEBUG: "False"
  # Any AWS load balancer hostname in us-east-1 (leading dot = subdomain match),
  # plus localhost for the kubelet's health probes, which send Host: localhost.
  DJANGO_ALLOWED_HOSTS: ".us-east-1.elb.amazonaws.com,localhost"
  DJANGO_CSRF_TRUSTED_ORIGINS: "http://*.us-east-1.elb.amazonaws.com"
