apiVersion: apps/v1
kind: Deployment
metadata:
  name: notesy
  namespace: notesy
  labels:
    app: notesy
spec:
  # Migrations run in the container entrypoint; one replica avoids concurrent
  # migrations on a fresh database.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # zero-downtime rollouts
  selector:
    matchLabels:
      app: notesy
  template:
    metadata:
      labels:
        app: notesy
    spec:
      containers:
        - name: notesy
          # Placeholder; the deploy step substitutes the ECR image:commit-SHA.
          image: "__IMAGE__"
          # No command/args: the image's entrypoint runs migrations, then gunicorn.
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: notesy-config
            - secretRef:
                name: notesy-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # the image's "app" user
            allowPrivilegeEscalation: false
          # Host: localhost so the probes pass DJANGO_ALLOWED_HOSTS.
          startupProbe:
            httpGet:
              path: /login/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 30 # up to ~150s for migrations
          readinessProbe:
            httpGet:
              path: /login/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login/
              port: 8000
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 20
            failureThreshold: 3
